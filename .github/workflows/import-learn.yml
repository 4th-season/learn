name: Import Learn

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-learn.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
      - name: Import learn directory from main site
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          git clone --depth 1 https://github.com/4th-season/4th-season.github.io.git "$TMP_DIR/source"
          cp -a "$TMP_DIR/source/learn/." .
          rm -rf "$TMP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Learn from 4th-season.github.io"
            git push
          fi
