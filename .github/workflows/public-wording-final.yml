name: Public wording final
on:
  push:
    branches: [main]
    paths: ['.github/workflows/public-wording-final.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://raw.githubusercontent.com/4th-season/4th-season.github.io/main/.github/public_cleanup3.py -o /tmp/f.py
          python /tmp/f.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/public-wording-final.yml
          git add -A
          git commit -m "Polish public navigation wording"
          git push
