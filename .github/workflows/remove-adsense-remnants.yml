name: Remove AdSense remnants

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-adsense-remnants.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove AdSense code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = [
              re.compile(r'<script\b(?=[^>]*\bsrc=["\'][^"\']*pagead2\.googlesyndication\.com/pagead/js/adsbygoogle\.js[^"\']*["\'])[^>]*>\s*</script>', re.I | re.S),
              re.compile(r'<meta\b(?=[^>]*\bname=["\']google-adsense-account["\'])[^>]*>', re.I | re.S),
              re.compile(r'<ins\b(?=[^>]*\bclass=["\'][^"\']*\badsbygoogle\b[^"\']*["\'])[^>]*>.*?</ins>', re.I | re.S),
              re.compile(r'<script\b[^>]*>\s*\(adsbygoogle\s*=\s*window\.adsbygoogle\s*\|\|\s*\[\]\)\.push\(\{\}\);?\s*</script>', re.I | re.S),
          ]
          changed = []
          remaining = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html', '.htm'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for pat in patterns:
                  new = pat.sub('', new)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
              if re.search(r'adsbygoogle|googlesyndication|google-adsense-account|ca-pub-', new, re.I):
                  remaining.append(str(p))

          ads = Path('ads.txt')
          if ads.exists():
              ads.unlink()
              changed.append('ads.txt (deleted)')

          print('Changed files:', len(changed))
          for x in changed:
              print('CHANGED', x)
          print('Remaining AdSense-like HTML references:', len(remaining))
          for x in remaining:
              print('REMAINING', x)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove AdSense remnants"
            git push
          fi
