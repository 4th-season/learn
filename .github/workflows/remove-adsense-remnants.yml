name: Verify AdSense removal

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-adsense-remnants.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for remaining AdSense references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          needles = re.compile(r'adsbygoogle|googlesyndication|google-adsense-account|ca-pub-7961518695832179|pub-7961518695832179', re.I)
          hits = []
          allowed = {'.html','.htm','.js','.json','.txt','.xml','.md','.css'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.name == 'adsense-scan-report.txt':
                  continue
              if p.suffix.lower() not in allowed and p.name != 'ads.txt':
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if needles.search(text):
                  hits.append(str(p))
          report = 'remaining=' + str(len(hits)) + '\n' + '\n'.join(hits) + ('\n' if hits else '')
          Path('adsense-scan-report.txt').write_text(report, encoding='utf-8')
          print(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adsense-scan-report.txt
          git commit -m "Verify AdSense removal"
          git push
