name: Public navigation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-nav-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean public navigation and language
        run: |
          curl -fsSL https://raw.githubusercontent.com/4th-season/4th-season.github.io/main/.github/public_cleanup.py -o /tmp/public_cleanup.py
          python /tmp/public_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/public-nav-cleanup.yml
          git add -A
          git commit -m "Simplify public navigation and remove hierarchy labels"
          git push
